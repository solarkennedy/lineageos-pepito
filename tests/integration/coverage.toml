# Which integration tests a release needs, by what changed since the last release.
#
# scripts/test_plan.py diffs every manifest project from its previous
# pepito-24.0-* tag to its pushed tip and matches each changed file, written as
# "<project path>/<file>", against the `paths` patterns below (fnmatch: `*`
# also matches `/`). A group whose patterns hit makes its tests required.
# The release-sweep skill then reads the changelog and may add tests, waive a
# matched one with a reason, or add manual checks (see tests/integration/README.md).
#
# If upstream lineage-24.0 moved since the last release (a SYNC_ALL build), every
# test here is required.

# Cheap, read-only, run on every release: proves the build boots far enough for
# IMS and the WFC plumbing to come up.
always = [
    "test_wfc.py::test_bridge_daemon_state",
    "test_wfc.py::test_wfcbridge_app_running",
    "test_wfc.py::test_mode_mirrors_siminfo",
    "test_wfc.py::test_vendor_props_follow_system_props",
    "test_wfc.py::test_wifi_ok_tracks_wifi",
    "test_wfc.py::test_th2_state_matches_conditions",
    "test_wfc.py::test_bridge_reads_wlan_rssi",
    # Memory config as released (MGLRU kill switch, zram lz4, vm tunables, lmkd
    # props) + kernel health. Read-only, ~5 s; catches a tunable dropped by an
    # unrelated mithorium.mk / init rc edit, so those files need no group below.
    "test_memory.py::test_kernel_health",
    "test_memory.py::test_kernel_config",
    "test_memory.py::test_mglru_follows_kill_switch",
    "test_memory.py::test_zram",
    "test_memory.py::test_vm_tunables",
    "test_memory.py::test_lmkd_config",
    # Post-flash smoke (the checks from the 2026-10-23 upstream rebase): stamped
    # build, patch level not stale, no platform crash or unknown SELinux denial
    # since boot, GApps privileged, cell service; and, with the screen awake, the
    # pepito UI patches carried in rebased forks (QS slider + torch, 3-button nav
    # with Launcher3, Updater + Tweaks pages). ~1 min.
    "test_system.py::test_build_is_stamped",
    "test_system.py::test_security_patch_level_fresh",
    "test_system.py::test_no_platform_crashes_since_boot",
    "test_system.py::test_selinux_no_new_denials",
    "test_system.py::test_gms_privileged",
    "test_system.py::test_cell_service",
    "test_system.py::test_quick_settings",
    "test_system.py::test_three_button_nav",
    "test_system.py::test_pepito_screens_open",
]

[groups.wfc]
description = "Wi-Fi calling: IWLAN bridge + TH2 steering, WfcBridge, IMS/QMI plumbing, carrier config, telephony framework, Wi-Fi/QMI kernel paths"
tests = [
    "test_wfc.py::test_call_hold",
    "test_wfc.py::test_call_walkaway",
]
paths = [
    "device/xiaomi/Mi8937/qmux/*",
    "device/xiaomi/Mi8937/WfcBridge/*",
    "device/xiaomi/Mi8937/sepolicy/*qmux*",
    "device/xiaomi/Mi8937/sepolicy/*property_contexts",
    "device/xiaomi/mithorium-common/overlay/packages/apps/CarrierConfig/*",
    "device/xiaomi/mithorium-common/libshim/*",
    "frameworks/opt/telephony/*",
    "vendor/xiaomi/*ims*",
    "vendor/xiaomi/*qcril*",
    "vendor/xiaomi/*qmi*",
    "kernel/xiaomi/msm8937/net/*",
    "kernel/xiaomi/msm8937/drivers/net/*",
    "kernel/xiaomi/msm8937/drivers/soc/qcom/*",
]

[groups.memory]
description = "Memory management: kernel mm/ (MGLRU), mm headers, zram, kernel defconfig, process lifecycle in ActivityManager. Runs the ~15 min mglru-bench pressure benches (--allow-bench)"
tests = [
    "test_memory.py::test_hog_pressure",
    "test_memory.py::test_app_cycle",
]
paths = [
    "kernel/xiaomi/msm8937/mm/*",
    "kernel/xiaomi/msm8937/include/linux/mm*",
    "kernel/xiaomi/msm8937/include/linux/*swap*",
    "kernel/xiaomi/msm8937/include/linux/memcontrol.h",
    "kernel/xiaomi/msm8937/include/linux/page-flags.h",
    "kernel/xiaomi/msm8937/include/linux/vmstat.h",
    "kernel/xiaomi/msm8937/drivers/block/zram/*",
    "kernel/xiaomi/msm8937/kernel/sched/psi.c",
    "kernel/xiaomi/msm8937/arch/arm64/mm/*",
    "kernel/xiaomi/msm8937/arch/arm64/configs/*",
    "frameworks/base/services/core/java/com/android/server/am/OomAdjuster*",
    "frameworks/base/services/core/java/com/android/server/am/ProcessList.java",
    "frameworks/base/services/core/java/com/android/server/am/CachedAppOptimizer.java",
]
