[pytest]
pythonpath = .
addopts = -rs
markers =
    call: places a real phone call (needs --allow-calls)
    disruptive: toggles Wi-Fi or another radio on the unit (needs --allow-disruptive)
    bench: long pressure benchmark that kills apps and holds the screen on (needs --allow-bench)
    timeout(seconds): per-test budget, enforced by conftest (default 180 s)
