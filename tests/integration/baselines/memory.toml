# Memory subsystem baseline for test_memory.py.
#
# Config: read off new2 on release 24.0-20261017 (kernel 4.19.325 ...-g253a9ff4e4d1,
# MGLRU default-on), 2026-10-17. That release is the known-good reference.
# Bench limits: regression bounds around the shipped numbers, not an A/B. The
# reference figures are the plans/PLAN-mglru.md Phase 2 A/B on dut1 (2026-10-16,
# debug kernel, so latencies there are inflated) and the post-sweep check on the
# release kernel. For a real before/after comparison of a memory change, run
# diag-tools/mglru-bench/mglru-ab.sh, not this.

[config]
lru_gen_enabled = "0x0001"          # with persist.gotweak.mglru = 1 (the default)
lru_gen_disabled = "0x0000"         # with persist.gotweak.mglru = 0
zram_algorithm = "lz4"              # zstd made lmkd kill what lz4 rides out (memory: zram-zstd-lmkd-kills)
zram_disksize = 1610612736
swappiness = 100
watermark_scale_factor = 1
extra_free_kbytes = 10800
kernel_config = ["CONFIG_LRU_GEN=y", "CONFIG_LRU_GEN_ENABLED=y", "CONFIG_ZRAM=y", "CONFIG_ZSMALLOC=y"]

[config.lmk_props]                  # lmkd "config G", the shipped tuning
"ro.lmk.lowmem_min_oom_score" = "1001"
"ro.lmk.relaxed_available_memory" = "true"
"ro.lmk.swap_compression_ratio" = "3"

[hog]
# hog-resume.sh -n 4 -m 1200 (Settings, Messages, Jelly, Aperture). Iteration 1 is
# the known post-idle outlier and is not counted.
# Reference, MGLRU on: 0.8 kills/hog (off: 2.5, worst cell 8), 40/40 resumed apps
# survived, mean resume 491 ms (debug kernel), psi full stall 1.58 s per hog.
iterations = 4
max_mean_kills_per_hog = 2.0
min_survival = 0.75
max_mean_resume_ms = 900
max_mean_psi_full_s = 3.5

[cycle]
# app-cycle.sh -r 3 -d 2 over lib.sh DEFAULT_APPS (those installed). Rounds 2+ count.
# Reference: 0/150 cold, mean launch 214 ms (debug kernel); post-sweep 1/30 cold.
rounds = 3
max_cold_rate = 0.10
max_mean_launch_ms = 450
