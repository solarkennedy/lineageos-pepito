# Upstream of every project in pepito.xml, for scripts/upstream.py (see REBASE.md).
# Every <project> in pepito.xml needs at least one line; the script refuses to
# run otherwise, so a new fork can't silently drop out of the monthly check.
#
#   <path>  <mode>  <upstream url>  <upstream ref>
#
# mode  rebase  our pepito-24 branch = upstream ref + our commits; rebased monthly
#       watch   unrelated history (merge-based or a different tree); the report
#               only lists what upstream committed lately, porting is by hand
#       follow  no fork: the manifest tracks upstream directly, sync pulls it
#       none    no upstream (our own repo, or upstream dropped it)
# ref   a branch, refs/tags/<tag>, or @aosp = the AOSP tag the upstream
#       lineage-24.0 manifest currently pins

device/xiaomi/Mi8937             rebase https://github.com/LineageOS/android_device_xiaomi_Mi8937           lineage-24.0
device/xiaomi/mithorium-common   rebase https://github.com/LineageOS/android_device_xiaomi_mithorium-common lineage-24.0
device/xiaomi/mithorium-common   watch  https://github.com/Mi-Thorium/android_device_xiaomi_mithorium-common a17/master
kernel/xiaomi/msm8937            rebase https://github.com/LineageOS/android_kernel_xiaomi_msm8937          lineage-24.0

frameworks/base                  rebase https://github.com/LineageOS/android_frameworks_base                lineage-24.0
frameworks/native                rebase https://github.com/LineageOS/android_frameworks_native              lineage-24.0
frameworks/opt/telephony         rebase https://github.com/LineageOS/android_frameworks_opt_telephony       lineage-24.0
vendor/lineage                   rebase https://github.com/LineageOS/android_vendor_lineage                 lineage-24.0
lineage-sdk                      rebase https://github.com/LineageOS/android_lineage-sdk                    lineage-24.0
packages/apps/LineageParts       rebase https://github.com/LineageOS/android_packages_apps_LineageParts     lineage-24.0
packages/apps/Launcher3          rebase https://github.com/LineageOS/android_packages_apps_Launcher3        lineage-24.0
bootable/recovery                rebase https://github.com/LineageOS/android_bootable_recovery              lineage-24.0
packages/apps/Updater            rebase https://github.com/LineageOS/android_packages_apps_Updater          lineage-24.0
hardware/interfaces              rebase https://github.com/LineageOS/android_hardware_interfaces            lineage-24.0
hardware/lineage/interfaces      rebase https://github.com/LineageOS/android_hardware_lineage_interfaces    lineage-24.0
build/make                       rebase https://github.com/LineageOS/android_build                          lineage-24.0
system/sepolicy                  rebase https://github.com/LineageOS/android_system_sepolicy                lineage-24.0
system/fs/fs_mgr                 rebase https://github.com/LineageOS/android_system_fs_fs_mgr               lineage-24.0
# upstream for this one is AOSP itself (Lineage doesn't fork it); it only moves
# when the upstream manifest bumps its AOSP tag
system/bpfprogs                  rebase https://android.googlesource.com/platform/system/bpfprogs           @aosp

# LineageOS dropped hardware/qcom-caf/bt from 24.0; ours is the 23.2 branch
hardware/qcom-caf/bt             none   -  -
vendor/xiaomi                    none   -  -
packages/apps/PepitoLauncher2    none   -  -
packages/apps/FaceUnlock         follow https://gitlab.com/crdroidandroid/android_packages_apps_FaceUnlock  17.0
